<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MBTI Personality Test</title><style> *{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font:16px system-ui,sans-serif}main{max-width:760px;margin:32px auto;padding:24px;background:white;border-radius:20px;box-shadow:0 8px 40px #142b4210}h1{font-size:30px}small,p{line-height:1.7}fieldset{border:0;border-bottom:1px solid #e2e8f0;padding:20px 0}legend{font-weight:650;padding-top:18px}label{display:block;padding:10px;border-radius:8px;cursor:pointer}label:has(input:checked){background:#dcefe9}input{accent-color:#087f75}button{border:0;border-radius:10px;padding:13px 20px;background:#087f75;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.4}nav{display:flex;justify-content:space-between;margin-top:20px;gap:10px}progress{width:100%;accent-color:#087f75} .bar{height:12px;background:#dce4ed;border-radius:9px;overflow:hidden}.bar i{display:block;background:#087f75;height:100%}.axis{margin:18px 0}.muted{color:#64748b} @media(max-width:600px){main{margin:0;border-radius:0;padding:18px}}</style><main><small class="muted">SELF-DISCOVERY / 40 QUESTIONS</small><h1>ค้นหาบุคลิกภาพ MBTI ของคุณ</h1><p>เลือกตามพฤติกรรมปกติของคุณ ไม่มีคำตอบถูกหรือผิด แบบประเมินนี้สร้างขึ้นเพื่อสำรวจตนเอง ไม่ใช่เครื่องมือ MBTI ทางการหรือการวินิจฉัยทางจิตวิทยา</p><div id="app"></div></main><script>
const groups=[[
'การพบปะผู้คนช่วยเติมพลังให้ฉัน','ฉันต้องการเวลาอยู่คนเดียวหลังเข้าสังคมนาน ๆ','ฉันมักเริ่มบทสนทนากับคนใหม่','ฉันชอบคิดให้เรียบร้อยก่อนพูด','ฉันคิดได้ดีขึ้นเมื่อแลกเปลี่ยนกับคนอื่น','ฉันชอบพักผ่อนเงียบ ๆ มากกว่ากิจกรรมกลุ่ม','ฉันมักอยากแบ่งปันไอเดียทันที','ฉันชอบทำความรู้จักคนทีละคนมากกว่ากลุ่มใหญ่','ฉันมักกระตือรือร้นเมื่อได้ทำกิจกรรมร่วมกับผู้อื่น','ฉันต้องการพื้นที่ส่วนตัวเพื่อฟื้นพลัง'],[
'ฉันสนใจความเป็นไปได้ในอนาคต','ฉันชอบเรียนรู้จากตัวอย่างที่จับต้องได้','ฉันมักมองหาความเชื่อมโยงระหว่างเรื่องต่าง ๆ','ฉันให้ความสำคัญกับข้อเท็จจริงที่สังเกตได้ก่อน','ฉันสนุกกับการคิดสมมติฐานใหม่ ๆ','ฉันชอบคำอธิบายที่เป็นรูปธรรมมากกว่าแนวคิดนามธรรม','ฉันมักเริ่มงานจากภาพรวม','ฉันชอบใช้ประสบการณ์ที่พิสูจน์แล้วเป็นจุดเริ่มต้น','ฉันชอบจินตนาการถึงสิ่งที่ยังไม่มี','ฉันมักสังเกตรายละเอียดของสิ่งรอบตัวก่อนภาพรวม'],[
'ฉันใช้หลักเหตุผลเป็นเกณฑ์หลักในการตัดสินใจ','ฉันให้น้ำหนักกับผลกระทบต่อความรู้สึกของคนเป็นพิเศษ','เมื่อเพื่อนมีปัญหา ฉันมักเสนอวิธีแก้ก่อน','ฉันมักรับฟังความรู้สึกก่อนเสนอทางแก้','ฉันชอบประเมินงานด้วยเกณฑ์เดียวกันสำหรับทุกคน','ฉันให้ความสำคัญกับคุณค่าเฉพาะบุคคลในการตัดสินใจ','ฉันมักแยกความชอบส่วนตัวออกจากการวิเคราะห์','ฉันมักให้ความสำคัญกับความกลมเกลียวเมื่อมีความขัดแย้ง','ฉันยอมรับข้อสรุปที่ไม่ถูกใจหากมีเหตุผลรองรับ','ฉันมักพิจารณาความต้องการเฉพาะของแต่ละคนก่อนใช้กฎทั่วไป'],[
'ฉันชอบกำหนดแผนก่อนเริ่มงาน','ฉันชอบเปิดทางเลือกไว้จนกว่าจะจำเป็นต้องตัดสินใจ','ฉันสบายใจเมื่อมีตารางงานชัดเจน','ฉันสนุกกับการเปลี่ยนแนวทางระหว่างทำงาน','ฉันชอบตัดสินใจให้เรียบร้อยล่วงหน้า','ฉันชอบจัดลำดับงานตามสถานการณ์ที่เปลี่ยนไป','ฉันมักเตรียมงานล่วงหน้าก่อนถึงกำหนด','ฉันชอบเดินทางโดยเปิดโอกาสให้เปลี่ยนแผนได้','ฉันชอบปิดงานหนึ่งให้เรียบร้อยก่อนเริ่มงานถัดไป','ฉันชอบกระบวนการทำงานที่ไม่กำหนดทุกขั้นตอนตายตัว']];
const qs=Array.from({length:40},(_,i)=>({axis:i%4,sign:Math.floor(i/4)%2?-1:1,text:groups[i%4][Math.floor(i/4)]}));const names={ISTJ:'นักจัดระบบ',ISFJ:'ผู้ดูแล',INFJ:'นักมองการณ์ไกล',INTJ:'นักวางกลยุทธ์',ISTP:'นักแก้ปัญหาเชิงปฏิบัติ',ISFP:'นักสร้างสรรค์อิสระ',INFP:'นักอุดมคติ',INTP:'นักวิเคราะห์',ESTP:'นักลงมือทำ',ESFP:'นักสร้างบรรยากาศ',ENFP:'นักสำรวจไอเดีย',ENTP:'นักคิดนวัตกรรม',ESTJ:'นักบริหารจัดการ',ESFJ:'นักประสานสัมพันธ์',ENFJ:'นักสร้างแรงบันดาลใจ',ENTJ:'นักขับเคลื่อนเป้าหมาย'};const stacks={ISTJ:'Si Te Fi Ne',ISFJ:'Si Fe Ti Ne',INFJ:'Ni Fe Ti Se',INTJ:'Ni Te Fi Se',ISTP:'Ti Se Ni Fe',ISFP:'Fi Se Ni Te',INFP:'Fi Ne Si Te',INTP:'Ti Ne Si Fe',ESTP:'Se Ti Fe Ni',ESFP:'Se Fi Te Ni',ENFP:'Ne Fi Te Si',ENTP:'Ne Ti Fe Si',ESTJ:'Te Si Ne Fi',ESFJ:'Fe Si Ne Ti',ENFJ:'Fe Ni Se Ti',ENTJ:'Te Ni Se Fi'};const fn={Ne:'สำรวจความเป็นไปได้และเชื่อมโยงไอเดีย',Ni:'สังเคราะห์ภาพรวมและทิศทางระยะยาว',Se:'รับรู้และตอบสนองต่อสถานการณ์จริง',Si:'อ้างอิงประสบการณ์และรายละเอียด',Te:'จัดระบบเพื่อผลลัพธ์ภายนอก',Ti:'ตรวจสอบความสอดคล้องทางตรรกะ',Fe:'คำนึงถึงความสัมพันธ์และบรรยากาศกลุ่ม',Fi:'พิจารณาคุณค่าและความเชื่อส่วนตัว'};const traits={E:['แลกเปลี่ยนไอเดียกับผู้อื่น','จัดเวลาสำหรับการไตร่ตรอง'],I:['ไตร่ตรองด้วยตนเอง','ฝึกสื่อสารความคิดให้ผู้อื่นเข้าใจ'],N:['มองภาพรวมและทางเลือกใหม่','ตรวจสอบรายละเอียดและข้อเท็จจริง'],S:['ใช้ข้อมูลจริงและรายละเอียด','เปิดรับสมมติฐานและแนวทางใหม่'],T:['วิเคราะห์ด้วยเหตุผล','พิจารณาผลกระทบทางความรู้สึก'],F:['คำนึงถึงคุณค่าและความสัมพันธ์','ตรวจสอบเหตุผลและเกณฑ์อย่างเป็นระบบ'],J:['จัดลำดับและวางแผน','เผื่อพื้นที่สำหรับการเปลี่ยนแปลง'],P:['ปรับตัวและสำรวจทางเลือก','กำหนดเส้นตายและเกณฑ์ปิดงาน']};let a={},page=0;const app=document.getElementById('app');function render(){app.innerHTML=`<progress max="40" value="${Object.keys(a).length}"></progress><p class="muted">ตอบแล้ว ${Object.keys(a).length}/40 • หน้า ${page+1}/8</p>`+qs.slice(page*5,page*5+5).map((q,j)=>{let i=page*5+j;return `<fieldset><legend>${i+1}. ${q.text}</legend>${['ตรงมาก','ค่อนข้างตรง','เป็นกลาง','ค่อนข้างไม่ตรง','ไม่ตรงเลย'].map((s,k)=>`<label><input type="radio" name="q${i}" value="${2-k}" ${a[i]===2-k?'checked':''} onchange="choose(${i},${2-k})"> ${s}</label>`).join('')}</fieldset>`}).join('')+`<nav><button onclick="page--;render();top.scrollTo(0,0)" ${page===0?'disabled':''}>ย้อนกลับ</button><button id="next" onclick="advance()">${page===7?'ดูผลวิเคราะห์':'ถัดไป'}</button></nav>`;check()}function check(){document.getElementById('next').disabled=!qs.slice(page*5,page*5+5).every((_,j)=>a[page*5+j]!==undefined)}function choose(i,v){a[i]=v;app.querySelector('progress').value=Object.keys(a).length;app.querySelector('p').textContent=`ตอบแล้ว ${Object.keys(a).length}/40 • หน้า ${page+1}/8`;check()}function advance(){if(page<7){page++;render();window.scrollTo(0,0)}else if(Object.keys(a).length===40)result()}function result(){let s=[0,0,0,0];qs.forEach((q,i)=>s[q.axis]+=a[i]*q.sign);let pairs=['EI','NS','TF','JP'];let candidates=Object.keys(names).filter(t=>s.every((v,i)=>v===0||t[i]===pairs[i][v>0?0:1]));let t=candidates[0];app.innerHTML=`<h2>${candidates.length===1?t+' — '+names[t]: 'ผลยังไม่ชัดเจน: '+candidates.join(' / ')}</h2><p>คะแนนสะท้อนความชอบที่รายงานด้วยตนเอง ไม่ใช่ความสามารถหรือความน่าจะเป็นของประเภท</p>`+s.map((v,i)=>{let p=50+v*2.5;return `<div class="axis"><strong>${pairs[i][0]} ${p}% — ${100-p}% ${pairs[i][1]}</strong><div class="bar"><i style="width:${p}%"></i></div><small>${v===0?'คะแนนเท่ากัน':Math.abs(v)<=4?'แนวโน้มเล็กน้อย':Math.abs(v)<=10?'แนวโน้มปานกลาง':'แนวโน้มค่อนข้างชัด'} (${v>0?'+':''}${v}/20)</small></div>`}).join('')+`<h3>เหตุผลหลักและแนวทางพัฒนา</h3>`+s.map((v,i)=>v===0?`<p>${pairs[i]}: ยังไม่พบความชอบด้านใดชัดเจน</p>`:`<p><b>${pairs[i][v>0?0:1]}</b> — แนวโน้มจุดแข็ง: ${traits[pairs[i][v>0?0:1]][0]}<br>สิ่งที่อาจฝึกเพิ่ม: ${traits[pairs[i][v>0?0:1]][1]}</p>`).join('')+`<h3>Cognitive Functions ตามทฤษฎี</h3>`+(candidates.length===1?stacks[t].split(' ').map((f,i)=>`<p><b>${['หลัก','สนับสนุน','ลำดับสาม','ลำดับสี่'][i]}: ${f}</b> — ${fn[f]}</p>`).join(''):'<p>ยังไม่ควรระบุลำดับฟังก์ชันเพียงชุดเดียว เพราะคะแนนบางแกนเท่ากัน</p>')+`<p class="muted">แบบทดสอบไม่ได้วัดฟังก์ชันโดยตรง และจุดแข็งเป็นเพียงแนวโน้ม ไม่ใช่ข้อสรุปเกี่ยวกับทุกคนในประเภทเดียวกัน</p><nav><button onclick="a={};page=0;render();window.scrollTo(0,0)">เริ่มใหม่</button><button onclick="window.print()">พิมพ์ / บันทึกผล</button></nav>`;window.scrollTo(0,0)}render();</script></html>
